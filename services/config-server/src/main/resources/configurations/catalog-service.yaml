# ==============================================================================
# CATALOG SERVICE CONFIGURATION (PHÂN PHỐI BỞI CONFIG SERVER)
# ==============================================================================
server:
  port: 8083

# Thư mục lưu ảnh sự kiện do Organizer upload (banner), phục vụ qua
# WebConfig#addResourceHandlers dưới /uploads/events/**. Đường dẫn tương đối
# theo working directory của tiến trình (mvnw -pl services/catalog spring-boot:run
# chạy với cwd = services/catalog).
catalog:
  upload:
    event-images-dir: uploads/events

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  # Cấu hình kết nối PostgreSQL (Container postgres-catalog :5435)
  datasource:
    url: jdbc:postgresql://${CATALOG_DB_HOST}:${CATALOG_DB_PORT}/${CATALOG_DB_NAME}
    username: ${CATALOG_DB_USER}
    password: ${CATALOG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Cấu hình kết nối Redis (Container redis :6379) — Cache Aside cho danh sách/chi
  # tiết sự kiện (TTL 5-15 phút), và
  # phân trang 1-based (page=1 là trang đầu) khớp đúng docs/api-design.md §3.2
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 20
        max-page-size: 50

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Flyway chịu trách nhiệm tạo bảng, JPA chỉ kiểm tra
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Apache Kafka (KRaft, container :9092) — Consumer: tickets.generated (Booking
  # Service bắn sau khi xác nhận thanh toán) -> trừ vĩnh viễn available_quantity
  # và invalidate cache Redis.
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    # Bật observation để Micrometer Tracing đọc traceId từ Kafka message header
    # (consumer) — trace không bị đứt đoạn khi đi qua Kafka.
    listener:
      observation-enabled: true
    consumer:
      group-id: catalog-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ticketbooking.common.event
        session.timeout.ms: 15000
        max.poll.interval.ms: 120000

  # OAuth2 Resource Server — CHỈ xác thực JWT bằng Public Key lấy từ JWKS của
  # auth-service (Zero Trust). Xem docs/system-design.md §8, §9.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json
