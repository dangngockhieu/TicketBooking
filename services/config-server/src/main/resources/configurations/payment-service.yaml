# ==============================================================================
# PAYMENT SERVICE CONFIGURATION (PHÂN PHỐI BỞI CONFIG SERVER)
# ==============================================================================
server:
  port: 8085

spring:
  # Cấu hình kết nối PostgreSQL (Container postgres-payment :5437)
  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST}:${PAYMENT_DB_PORT}/${PAYMENT_DB_NAME}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 20
        max-page-size: 50

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Flyway chịu trách nhiệm tạo bảng, JPA chỉ kiểm tra
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Apache Kafka (KRaft, container :9092) — Producer: payment.success/payment.failed
  # Consumer group riêng cho payment-service
  # để lắng nghe booking.refund-requested (Saga compensation).
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        max.block.ms: 10000
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ticketbooking.common.event
        session.timeout.ms: 15000
        max.poll.interval.ms: 120000

  # OAuth2 Resource Server — CHỈ xác thực JWT bằng Public Key lấy từ JWKS của
  # auth-service (Zero Trust). Xem docs/system-design.md §8, §9.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

# Nơi gọi sang Booking Service xác thực booking trước khi khởi tạo thanh toán
# (xem docs/api-design.md §5.1), Catalog Service lấy commission_rate/flat_fee_per_ticket
# để tính tiền vào ví Organizer (GĐ4 mục 4), và User Service lấy snapshot tài
# khoản ngân hàng đã xác minh khi tạo PayoutRequest (docs/database-schema.md
# §2, §5) — trỏ qua Eureka bằng application name.
booking-service:
  name: booking-service

catalog-service:
  name: catalog-service

user-service:
  name: user-service

# MoMo Payment Gateway — thông tin thương nhân dùng để ký/xác minh signature
# HMAC-SHA256 (xem docs/api-design.md §5). KHÔNG hardcode secret, luôn qua .env.
momo:
  partner-code: ${MOMO_PARTNER_CODE}
  access-key: ${MOMO_ACCESS_KEY}
  secret-key: ${MOMO_SECRET_KEY}
  endpoint: ${MOMO_ENDPOINT}
  redirect-url: ${MOMO_REDIRECT_URL}
  ipn-url: ${MOMO_IPN_URL}
