# ==============================================================================
# BOOKING SERVICE CONFIGURATION (PHÂN PHỐI BỞI CONFIG SERVER)
# ==============================================================================
server:
  port: 8084

spring:
  # Cấu hình kết nối PostgreSQL (Container postgres-booking :5436)
  datasource:
    url: jdbc:postgresql://${BOOKING_DB_HOST}:${BOOKING_DB_PORT}/${BOOKING_DB_NAME}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Cấu hình kết nối Redis (Container redis :6379) — Atomic Seat Hold (xem
  # docs/database-schema.md §4 "Redis Keys", docs/technical-flows.md) và bắt
  # sự kiện keyspace notification "expired" làm safety net nhả ghế tự động.
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
    web:
      pageable:
        one-indexed-parameters: true
        default-page-size: 10
        max-page-size: 50

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Flyway chịu trách nhiệm tạo bảng, JPA chỉ kiểm tra
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Apache Kafka (KRaft, container :9092) — Consumer: payment.success (xác nhận
  # thanh toán -> PAID/ISSUED -> bắn tiếp tickets.generated). Producer:
  # tickets.generated cho Catalog/Notification Service
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    # Bật observation để Micrometer Tracing gắn/đọc traceId qua Kafka message
    # header (producer + consumer) — trace không bị đứt đoạn khi đi qua Kafka.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        max.block.ms: 10000
    consumer:
      group-id: booking-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ticketbooking.common.event
        session.timeout.ms: 15000
        max.poll.interval.ms: 120000

  # OAuth2 Resource Server — CHỈ xác thực JWT bằng Public Key lấy từ JWKS của
  # auth-service (Zero Trust). Xem docs/system-design.md §8, §9.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

# Nơi gọi sang Catalog Service để lấy thông tin sự kiện/hạng vé (giá, số vé còn
# lại, cửa sổ mở bán) khi tạo đơn — trỏ qua Eureka bằng application name, không
catalog-service:
  name: catalog-service

# Nơi gọi sang Queue Service để kiểm tra queueAccessToken khi phòng chờ ảo
# đang bật cho sự kiện (xem docs/virtual-waiting-room.md §8).
queue-service:
  name: queue-service

# Seat Hold — thời gian giữ chỗ trước khi tự động hủy đơn (xem
booking:
  hold:
    ttl-seconds: 600
