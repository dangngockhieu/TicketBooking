# ==============================================================================
# AUTH SERVICE CONFIGURATION (PHÂN PHỐI BỞI CONFIG SERVER)
# ==============================================================================
server:
  port: 8081

app:
  bootstrap-admin:
    email: ${AUTH_ADMIN_EMAIL:}
    password: ${AUTH_ADMIN_PASSWORD:}

spring:
  # Cấu hình kết nối PostgreSQL (Container postgres-auth :5433)
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST}:${AUTH_DB_PORT}/${AUTH_DB_NAME}
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Cấu hình kết nối Redis (Container redis :6379) — dùng cho OTP xác thực email
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Flyway chịu trách nhiệm tạo bảng, JPA chỉ kiểm tra
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # Flyway Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Apache Kafka (KRaft, container :9092) — Producer: auth.otp-requested cho
  # Notification Service gửi email OTP thật (xem docs/technical-flows.md §0).
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    # Bật observation để Micrometer Tracing gắn traceId vào Kafka message header
    # (producer) — trace không bị đứt đoạn khi request đi qua Kafka.
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # max.block.ms chặn .send() treo vô hạn nếu không lấy được metadata (Kafka
        # down/không tới được); delivery.timeout.ms phải >= request.timeout.ms.
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        max.block.ms: 10000

# Cấu hình Token JWT — RS256 (RSA Asymmetric Keys). Key đọc từ file (base64 DER: PKCS8 private / X509 public),
# đường dẫn file trỏ tới bởi biến môi trường, KHÔNG lưu nội dung key trực tiếp trong .env
jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  key-id: ${JWT_KEY_ID:auth-key-1}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS}
