version: '3.8'

services:
  # ============================================================================
  # 1. INFRASTRUCTURE: DATABASES (5 Physical Containers)
  # ============================================================================
  postgres-auth:
    image: postgres:16-alpine
    container_name: ticketbooking-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass_2026}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketbooking-network

  postgres-user:
    image: postgres:16-alpine
    container_name: ticketbooking-postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      POSTGRES_USER: ${USER_DB_USER:-user_svc_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_svc_pass_2026}
    ports:
      - "${USER_DB_PORT:-5434}:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-user_svc_user} -d ${USER_DB_NAME:-user_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketbooking-network

  postgres-catalog:
    image: postgres:16-alpine
    container_name: ticketbooking-postgres-catalog
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog_db}
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog_user}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass_2026}
    ports:
      - "${CATALOG_DB_PORT:-5435}:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER:-catalog_user} -d ${CATALOG_DB_NAME:-catalog_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketbooking-network

  postgres-booking:
    image: postgres:16-alpine
    container_name: ticketbooking-postgres-booking
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME:-booking_db}
      POSTGRES_USER: ${BOOKING_DB_USER:-booking_user}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_pass_2026}
    ports:
      - "${BOOKING_DB_PORT:-5436}:5432"
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_DB_USER:-booking_user} -d ${BOOKING_DB_NAME:-booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketbooking-network

  postgres-payment:
    image: postgres:16-alpine
    container_name: ticketbooking-postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment_user}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_pass_2026}
    ports:
      - "${PAYMENT_DB_PORT:-5437}:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER:-payment_user} -d ${PAYMENT_DB_NAME:-payment_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketbooking-network

  # ============================================================================
  # 2. INFRASTRUCTURE: REDIS, KAFKA, MONGO, MONITORING
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ticketbooking-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
      --save 60 1
      --loglevel warning
      --notify-keyspace-events Ex
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ticketbooking-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ticketbooking-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:${KAFKA_PORT:-9092},CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:${KAFKA_PORT:-9092} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ticketbooking-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ticketbooking-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ticketbooking-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-admin_kafka_2026}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ticketbooking-network

  mongodb:
    image: mongo:7.0
    container_name: ticketbooking-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo_secure_pass_2026}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-notification_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER:-mongo_admin}", "-p", "${MONGO_ROOT_PASSWORD:-mongo_secure_pass_2026}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketbooking-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ticketbooking-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - ticketbooking-network

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ticketbooking-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_grafana_2026}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - ticketbooking-network

  # ============================================================================
  # 3. APPLICATION MICROSERVICES (Multi-Stage Built)
  # ============================================================================
  discovery:
    build:
      context: .
      dockerfile: services/discovery/Dockerfile
    container_name: ticketbooking-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - ticketbooking-network

  config-server:
    build:
      context: .
      dockerfile: services/config-server/Dockerfile
    container_name: ticketbooking-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    depends_on:
      - discovery
    networks:
      - ticketbooking-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: ticketbooking-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # optional: nếu config-server không reachable lúc khởi động, service vẫn
      # start được bằng env var trực tiếp bên dưới (xem application.yaml mỗi
      # service — spring.config.import luôn là optional:).
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-auth_db}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-auth_user}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass_2026}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      # Cặp khoá RS256 (xem .env.example mục 9) — mount từ host qua volume bên
      # dưới, path tuyệt đối trong container thay vì path tương đối như khi
      # chạy bằng mvnw.
      JWT_PRIVATE_KEY_PATH: /app/secrets/private.key
      JWT_PUBLIC_KEY_PATH: /app/secrets/public.key
      JWT_KEY_ID: ${JWT_KEY_ID:-auth-key-1}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}
      JWT_REFRESH_TOKEN_EXPIRATION_SECONDS: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:-2592000}
    volumes:
      - ./secrets/jwt:/app/secrets:ro
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery:
        condition: service_started
    networks:
      - ticketbooking-network

  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: ticketbooking-user-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/${USER_DB_NAME:-user_db}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER:-user_svc_user}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:-user_svc_pass_2026}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    depends_on:
      postgres-user:
        condition: service_healthy
      discovery:
        condition: service_started
    networks:
      - ticketbooking-network

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    container_name: ticketbooking-catalog-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-catalog:5432/${CATALOG_DB_NAME:-catalog_db}
      SPRING_DATASOURCE_USERNAME: ${CATALOG_DB_USER:-catalog_user}
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass_2026}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    depends_on:
      postgres-catalog:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery:
        condition: service_started
    networks:
      - ticketbooking-network

  booking-service:
    build:
      context: .
      dockerfile: services/booking/Dockerfile
    container_name: ticketbooking-booking-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-booking:5432/${BOOKING_DB_NAME:-booking_db}
      SPRING_DATASOURCE_USERNAME: ${BOOKING_DB_USER:-booking_user}
      SPRING_DATASOURCE_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_pass_2026}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    depends_on:
      postgres-booking:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery:
        condition: service_started
    networks:
      - ticketbooking-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: ticketbooking-payment-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/${PAYMENT_DB_NAME:-payment_db}
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USER:-payment_user}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_pass_2026}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-MOMOBKUN20180529}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-klm05TvNBzhg7h7j}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-at67qH6mk8w5Y1nAyMoTKhpAoNTVMkSf}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery:
        condition: service_started
    networks:
      - ticketbooking-network

  queue-service:
    build:
      context: .
      dockerfile: services/queue/Dockerfile
    container_name: ticketbooking-queue-service
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    depends_on:
      redis:
        condition: service_healthy
      discovery:
        condition: service_started
    networks:
      - ticketbooking-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ticketbooking-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    depends_on:
      - discovery
      - auth-service
      - catalog-service
      - booking-service
      - payment-service
    networks:
      - ticketbooking-network

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  postgres_auth_data:
    driver: local
  postgres_user_data:
    driver: local
  postgres_catalog_data:
    driver: local
  postgres_booking_data:
    driver: local
  postgres_payment_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  mongo_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  ticketbooking-network:
    name: ticketbooking-network
    driver: bridge
